<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Imprime tus tarjetas — qrveda</title>
<script src="qrcode.min.js"></script>
<style>
  :root{
    --tinta:#171512; --suave:#6d655b; --acento:#8a6d3b;
    --linea:#d9d2c6; --fondo:#e7e3dc; --panel:#fff;
  }
  *{ box-sizing:border-box; margin:0; padding:0; }
  body{
    font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
    color:var(--tinta); background:var(--fondo); overflow:hidden;
  }
  .app{ display:grid; grid-template-columns:380px 1fr; height:100vh; }
  @media (max-width:860px){ .app{ grid-template-columns:1fr; overflow:auto; } }

  .panel{
    background:var(--panel); border-right:1px solid var(--linea);
    padding:20px 22px 40px; overflow-y:auto;
  }
  .volver{ display:inline-block; margin-bottom:16px; font-size:12.5px;
           color:var(--suave); text-decoration:none; }
  .volver:hover{ color:var(--acento); }
  h1{ font-size:16px; font-weight:650; letter-spacing:-.01em; }
  h2{ font-size:11px; text-transform:uppercase; letter-spacing:.14em;
      color:var(--suave); margin:24px 0 10px; font-weight:600; }
  p.ayuda{ color:var(--suave); font-size:12.5px; margin-top:6px; }

  /* ---------------- Tus sobres ---------------- */
  .sobre{
    display:flex; align-items:center; gap:12px; padding:11px 0;
    border-bottom:1px solid var(--linea);
  }
  .sobre .texto{ flex:1; min-width:0; }
  .sobre .preg{
    font-family:"Iowan Old Style",Palatino,Georgia,serif; font-style:italic;
    font-size:14.5px; color:var(--acento); line-height:1.25;
  }
  .sobre .num{ font-size:11px; color:var(--suave); letter-spacing:.08em; }

  .cuantos{ display:flex; align-items:center; gap:2px; flex:0 0 auto; }
  .cuantos button{
    width:28px; height:28px; border-radius:7px; cursor:pointer;
    border:1px solid var(--linea); background:var(--panel); color:var(--suave);
    font:600 15px/1 system-ui,sans-serif;
  }
  .cuantos button:hover{ border-color:var(--acento); color:var(--acento); }
  .cuantos .n{
    width:32px; text-align:center; font-variant-numeric:tabular-nums;
    font-size:14px; font-weight:600;
  }
  .cuantos .n.cero{ color:var(--linea); font-weight:400; }

  .total{
    margin-top:16px; font-size:12.5px; color:var(--suave);
  }
  .total strong{ color:var(--tinta); }

  button.fuerte{
    width:100%; margin-top:16px; padding:12px; border-radius:9px; cursor:pointer;
    border:1px solid var(--tinta); background:var(--tinta); color:#fff;
    font:550 14px/1 system-ui,sans-serif;
  }
  button.fuerte:hover{ background:var(--acento); border-color:var(--acento); }
  button.fuerte:disabled{ opacity:.4; cursor:default; }

  .barra{
    position:sticky; top:0; z-index:5; display:flex; align-items:center; gap:8px;
    background:var(--fondo); padding-bottom:14px; flex-wrap:wrap;
  }
  .barra button{
    padding:4px 9px; font-size:12px; border-radius:7px; cursor:pointer;
    border:1px solid var(--linea); background:var(--panel); color:inherit;
  }
  .barra button:hover{ border-color:var(--acento); color:var(--acento); }
  .zoomval{ font-variant-numeric:tabular-nums; font-size:12.5px;
            color:var(--suave); min-width:44px; text-align:center; }

  details.avanzado{ margin-top:24px; border-top:1px solid var(--linea); padding-top:14px; }
  details.avanzado summary{ font-size:12px; color:var(--suave); cursor:pointer; list-style:none; }
  details.avanzado summary::-webkit-details-marker{ display:none; }
  details.avanzado summary::before{ content:"+ "; color:var(--acento); }
  details.avanzado[open] summary::before{ content:"− "; }
  details.avanzado label{ display:block; margin-top:12px; }
  details.avanzado small{ display:block; font-size:11px; color:var(--suave); margin-bottom:4px; }
  details.avanzado input{
    width:100%; padding:7px 9px; border:1px solid var(--linea);
    border-radius:6px; background:var(--panel); color:inherit; font:inherit;
  }

  /* ---------------- El pliego ---------------- */
  .zona{ position:relative; overflow:auto; padding:26px; }
  #lienzo{ transform-origin:0 0; }
  .hoja{
    position:relative; width:210mm; height:297mm; background:#fff;
    box-shadow:0 3px 22px rgba(0,0,0,.16); margin-bottom:24px;
  }
  .rejilla{
    position:absolute; left:10mm; top:11mm;
    display:grid; grid-template-columns:repeat(2,85mm); grid-template-rows:repeat(5,55mm);
  }
  .m{ position:absolute; background:#000; }
  .m.v{ width:.25pt; height:4mm; }
  .m.h{ height:.25pt; width:4mm; }

  .tarjeta{
    width:85mm; height:55mm; padding:4.5mm 5.5mm 3.5mm; overflow:hidden;
    background:#fff; color:#171512;
    font-family:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
  }
  .tarjeta .titulo{ font-size:10.6pt; line-height:1.2; letter-spacing:-.005em; }
  .tarjeta .pregunta{ font-style:italic; color:#8a6d3b; }
  .tarjeta .codigos{ margin-top:2.5mm; text-align:center; }
  .tarjeta .codigos svg{ display:block; margin:0 auto; }
  .vacia{ outline:1px dashed var(--linea); outline-offset:-1px; }

  @page{ size:A4 portrait; margin:0; }
  @media print{
    body{ background:#fff; overflow:visible; }
    .app{ display:block; }
    .panel, .barra{ display:none !important; }
    .zona{ padding:0; overflow:visible; }
    #lienzo{ transform:none !important; }
    .hoja{ box-shadow:none; margin:0; page-break-after:always; }
    .hoja:last-child{ page-break-after:auto; }
    .vacia{ outline:none; }
  }
</style>
</head>
<body>

<div class="app">
  <div class="panel">
    <a class="volver" href="/">← qrveda</a>
    <h1>Imprime tus tarjetas</h1>
    <p class="ayuda">Elige cuántas quieres de cada sobre. El texto y el código son los suyos: no se tocan.</p>

    <h2>Tus sobres</h2>
    <div id="lista"></div>
    <p class="total" id="total"></p>

    <button class="fuerte" id="pdf">Guardar PDF para imprenta</button>
    <p class="ayuda">Se abre el diálogo de impresión. Elige <strong>Guardar como PDF</strong>, escala <strong>100 %</strong> y quita «ajustar al papel».</p>

    <details class="avanzado">
      <summary>Ajustes finos</summary>
      <label><small>Tamaño del código (mm)</small>
        <input id="qrmm" type="number" step="0.5" min="10" max="34" value="30"></label>
      <p class="ayuda" id="densidad"></p>
    </details>
  </div>

  <div class="zona">
    <div class="barra">
      <button id="menos">−</button>
      <span class="zoomval" id="zoomval">100 %</span>
      <button id="mas">+</button>
      <button id="ajustar">Ajustar</button>
      <button id="cien">100 %</button>
    </div>
    <div id="lienzo"></div>
  </div>
</div>

<script>
"use strict";

const SITIO = "https://qr.vedicvault.org";
const CLAVE_JUEGO = "qrveda";
const CLAVE = "qrveda_imprenta";
const HUECOS = 10;                 // 2 x 5 en A4
const MODULO_MINIMO = 0.50;        // mm por celda; por debajo un móvil falla

const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;" }[c]));

let mios = [];        // los sobres abiertos
let cuantas = {};     // cuántas tarjetas de cada uno
let idioma = "es";
let zoom = 1;

/* ---------------- Los sobres del jugador ---------------- */
async function cargarSobres() {
  let guardado = {};
  try { guardado = JSON.parse(localStorage.getItem(CLAVE_JUEGO)) || {}; } catch (e) {}
  const progreso = guardado.progreso || {};
  idioma = guardado.idioma === "en" ? "en" : "es";

  const datos = await (await fetch("/datos.json")).json();
  mios = datos.tarjetas.filter(c => progreso[c.id] && progreso[c.id].respuesta && progreso[c.id].leido);

  try { cuantas = JSON.parse(localStorage.getItem(CLAVE)) || {}; } catch (e) {}
  // Sin nada elegido, se reparte la hoja entre los que tengas.
  if (!Object.keys(cuantas).length && mios.length) {
    const base = Math.floor(HUECOS / mios.length) || 1;
    mios.forEach((c, i) => cuantas[c.id] = base + (i < HUECOS % mios.length ? 1 : 0));
  }
  // Lo guardado de otra vez puede hablar de sobres que ya no salen.
  Object.keys(cuantas).forEach(id => { if (!mios.some(c => c.id === id)) delete cuantas[id]; });
}

const guardar = () => { try { localStorage.setItem(CLAVE, JSON.stringify(cuantas)); } catch (e) {} };
const totalTarjetas = () => Object.values(cuantas).reduce((a, b) => a + b, 0);

/* ---------------- El código ---------------- */
const cacheQR = new Map();

function qrSvg(url, mm) {
  const llave = url + "|" + mm;
  if (!cacheQR.has(llave)) {
    const q = qrcode(0, "M");
    q.addData(url);
    q.make();
    const n = q.getModuleCount(), borde = 2, lado = n + borde * 2;
    let d = "";
    for (let f = 0; f < n; f++)
      for (let c = 0; c < n; c++)
        if (q.isDark(f, c)) d += `M${c + borde} ${f + borde}h1v1h-1z`;
    cacheQR.set(llave, {
      svg: `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${lado} ${lado}" ` +
           `style="width:${mm}mm;height:${mm}mm" shape-rendering="crispEdges">` +
           `<path fill="#111" d="${d}"/></svg>`,
      modulos: lado,
    });
  }
  return cacheQR.get(llave);
}

/* ---------------- Panel ---------------- */
function pintarLista() {
  if (!mios.length) {
    $("lista").innerHTML = `<p class="ayuda">Aún no has abierto ningún sobre.
      Vuelve cuando tengas alguno y podrás imprimir sus tarjetas.</p>`;
    $("total").textContent = "";
    $("pdf").disabled = true;
    return;
  }

  $("lista").innerHTML = mios.map(c => {
    const n = cuantas[c.id] || 0;
    return `<div class="sobre">
      <div class="texto">
        <div class="preg">${esc(c[idioma][2])}</div>
        <div class="num">Sobre ${c.id} · ${c.clave}</div>
      </div>
      <div class="cuantos">
        <button data-menos="${c.id}" aria-label="menos">−</button>
        <span class="n${n ? "" : " cero"}">${n}</span>
        <button data-mas="${c.id}" aria-label="más">+</button>
      </div>
    </div>`;
  }).join("");

  const t = totalTarjetas();
  const hojas = Math.max(1, Math.ceil(t / HUECOS));
  $("total").innerHTML = `<strong>${t}</strong> tarjeta${t === 1 ? "" : "s"} · ${hojas} hoja${hojas === 1 ? "" : "s"} A4`;
  $("pdf").disabled = t === 0;
}

/* ---------------- El pliego ---------------- */
function marcas() {
  let piezas = "";
  for (let c = 0; c <= 2; c++) {
    const x = 10 + c * 85;
    piezas += `<div class="m v" style="left:${x}mm;top:5.8mm"></div>`;
    piezas += `<div class="m h" style="top:${11 + 275 + 1.2}mm;left:${x}mm;width:.25pt;height:4mm"></div>`;
    piezas += `<div class="m v" style="left:${x}mm;top:${11 + 275 + 1.2}mm"></div>`;
  }
  for (let f = 0; f <= 5; f++) {
    const y = 11 + f * 55;
    piezas += `<div class="m h" style="top:${y}mm;left:4.8mm"></div>`;
    piezas += `<div class="m h" style="top:${y}mm;left:${10 + 170 + 1.2}mm"></div>`;
  }
  return piezas;
}

function pintarPliego() {
  const mm = parseFloat($("qrmm").value) || 30;

  // Una tarjeta por unidad pedida, en el orden de la lista.
  const cola = [];
  mios.forEach(c => { for (let i = 0; i < (cuantas[c.id] || 0); i++) cola.push(c); });

  let peor = 0;
  const tarjeta = c => {
    const { svg, modulos } = qrSvg(SITIO + "/" + c.id, mm);
    peor = Math.max(peor, modulos);
    const [l1, l2, preg] = c[idioma];
    return `<div class="tarjeta">
      <div class="titulo">${esc(l1)}<br>${esc(l2)}<br><span class="pregunta">${esc(preg)}</span></div>
      <div class="codigos">${svg}</div>
    </div>`;
  };

  const hojas = Math.max(1, Math.ceil(cola.length / HUECOS));
  let salida = "";
  for (let h = 0; h < hojas; h++) {
    let rejilla = "";
    for (let i = 0; i < HUECOS; i++) {
      const c = cola[h * HUECOS + i];
      rejilla += c ? tarjeta(c) : `<div class="tarjeta vacia"></div>`;
    }
    salida += `<div class="hoja"><div class="rejilla">${rejilla}</div>${marcas()}</div>`;
  }
  $("lienzo").innerHTML = salida;

  if (peor) {
    const celda = mm / peor;
    $("densidad").textContent = celda < MODULO_MINIMO
      ? `${celda.toFixed(2)} mm por celda: demasiado apretado, agrándalo.`
      : `${celda.toFixed(2)} mm por celda. Tamaño correcto.`;
  }
}

function refrescar() { pintarLista(); pintarPliego(); guardar(); aplicarZoom(); }

/* ---------------- Zoom ---------------- */
function aplicarZoom() {
  const l = $("lienzo");
  l.style.transform = `scale(${zoom})`;
  l.style.width = `calc(210mm * ${zoom})`;
  const alto = l.querySelectorAll(".hoja").length * 321;   // 297mm + margen
  l.style.height = `calc(${alto}mm * ${zoom})`;
  $("zoomval").textContent = Math.round(zoom * 100) + " %";
}

function ajustar() {
  const zona = document.querySelector(".zona");
  const hoja = document.querySelector(".hoja");
  if (!hoja) return;
  zoom = Math.max(0.2, Math.min(3, (zona.clientWidth - 62) / (hoja.getBoundingClientRect().width / zoom)));
  aplicarZoom();
}

/* ---------------- Eventos ---------------- */
$("lista").addEventListener("click", e => {
  const b = e.target.closest("button");
  if (!b) return;
  const id = b.dataset.mas || b.dataset.menos;
  if (!id) return;
  const n = cuantas[id] || 0;
  cuantas[id] = b.dataset.mas ? Math.min(99, n + 1) : Math.max(0, n - 1);
  refrescar();
});

$("qrmm").addEventListener("input", refrescar);
$("pdf").addEventListener("click", () => window.print());
$("menos").addEventListener("click", () => { zoom = Math.max(0.2, zoom - 0.1); aplicarZoom(); });
$("mas").addEventListener("click", () => { zoom = Math.min(3, zoom + 0.1); aplicarZoom(); });
$("ajustar").addEventListener("click", ajustar);
$("cien").addEventListener("click", () => { zoom = 1; aplicarZoom(); });

/* ---------------- Arranque ---------------- */
(async function () {
  await cargarSobres();
  refrescar();
  setTimeout(ajustar, 60);
})();
</script>

</body>
</html>
